name: Serversentials
version: '2.0'
main: com.jolly.serversentials.Serversentials
api-version: '1.21'
authors: [ Jolly ]
load: STARTUP
folia-supported: true
softdepend: [PlaceholderAPI, Vault]
commands:
  ssreload:
    description: Reload Serversentials configs
    usage: /ssreload
    default: op
  fly:
    description: Allows flight
    default: false
  gms:
    description: Gamemode Survival
    default: false
  gmc:
    description: Gamemode Creative
    default: false
  gmsp:
    description: Gamemode Spectator
    default: false
  nick:
    description: Change Displayname
    default: false
  tpa:
    description: Teleport to a player
    default: false
  tpahere:
    description: Teleport a player to you
    aliases: [tpah]
    default: false
  tpaccept:
    description: Accepts a teleport request
    aliases: [tpc]
    default: false
  tpdeny:
    description: Denies a teleport request
    aliases: [tpd]
    default: false
  tptoggle:
    description: Toggles teleport requests on/off
    aliases: [tpt]
    default: false
  tpo:
    description: Force teleport to a player
    default: false
  tpohere:
    description: Force teleport a player to you
    default: false
  home:
    description: Teleport to a set home
    default: false
  sethome:
    description: Set a home to use /home to
    default: false
  delhome:
    description: Deletes a specified home
    default: false
  homes:
    description: Lists all homes
    default: false
  craft:
    default: false
  anvil:
    default: false
  loom:
    default: false
  echest:
    aliases: [ec]
    default: false
  invsee:
    aliases: [inv]
    default: false
  stonecutter:
    aliases: [scutter]
    default: false
  smithingtable:
    aliases: [smith]
    default: false
  vanish:
    aliases: [v]
    default: false
  #hide:
    #default: false
  monitor:
    aliases: [mon]
    default: false
  heal:
    default: false
  feed:
    default: false
  god:
    default: false
  warp:
    default: false
  warps:
    default: false
  setwarp:
    default: false
  delwarp:
    default: false
  item:
    aliases: [i]
    default: false
  itemrename:
    description: Rename the display name of your held item
    aliases: [iname, itemname]
    default: false
  lore:
    description: Edit the lore of your held item
    default: false
  enchant:
    aliases: [ench]
    default: false
  balance:
    description: Check your balance
    usage: /balance [player]
    default: false
    aliases: [bal]
  pay:
    description: Pay another player
    usage: /pay <player> <amount>
    default: false
  economy:
    description: Admin economy commands
    usage: /economy <give/set/deduct> <player> <amount>
    default: false
    aliases: [eco]
  baltop:
    description: Show top balances
    usage: /baltop [page]
    default: false
  day:
    description: Set time to day
    default: false
  noon:
    description: Set time to noon
    default: false
  night:
    description: Set time to night
    default: false
  clear:
    description: Set weather to clear
    default: false
  rain:
    description: Set weather to rain
    default: false
  storm:
    description: Set weather to storm
    default: false
  top:
    description: Teleport to the top-most block at your coordinates
    default: false
  rtp:
    description: Randomly teleport in your world inside the worldborder
    default: false
  back:
    description: Teleport to your previous location or death point
    default: false
  msg:
    description: Send a private message to a player
    aliases: [w, tell, pm, message]
    default: false
  r:
    description: Reply to the last private message received
    aliases: [reply]
    default: false
  socialspy:
    description: Toggle social spy to see others' private messages
    default: false
  sc:
    description: Staff chat channel
    aliases: [staffchat]
    default: false
  whois:
    description: Lookup a player's real name by their displayname
    usage: /whois <nickname>
    default: false

permissions:
  serversentials.reload:
    default: op
  serversentials.whois:
    description: Allows lookup of a player's real name by their displayname
    default: op
  serversentials.fly:
    description: Allows flight
    default: op
  serversentials.gms:
    description: Gamemode Survival
    default: op
  serversentials.gmc:
    description: Gamemode Creative
    default: op
  serversentials.gmsp:
    description: Gamemode Spectator
    default: op
  serversentials.nick:
    description: Change nickname
    default: op
  serversentials.tpa:
    description: Tp to a player
    default: op
  serversentials.tpahere:
    description: Tp a player to you
    default: op
  serversentials.tpaccept:
    description: Accept teleport request
    default: op
  serversentials.tpdeny:
    description: Deny teleport request
    default: op
  serversentials.tptoggle:
    description: Toggle tp status
    default: op
  serversentials.tpo:
    description: Override tp to player
    default: op
  serversentials.tpohere:
    description: Override tphere to player
    default: op
  serversentials.home:
    description: Teleport to home
    default: op
  serversentials.home.cooldown.<#>:
    description: Specify the cooldown per /home command
    default: op
  serversentials.home.bypasscooldown:
    description: Bypass /home command cooldown
    default: op
  serversentials.home.countdown.<#>:
    description: How many seconds before actual teleport
    default: op
  serversentials.sethome:
    description: Sets a home
    default: op
  serversentials.sethome.<#>:
    description: Specify how many homes a player/group can create
    default: op
  serversentials.delhome:
    description: Deletes a home
    default: op
  serversentials.homes:
    description: Lists homes
    default: op
  serversentials.echest:
    default: op
  serversentials.craft:
    default: op
  serversentials.loom:
    default: op
  serversentials.anvil:
    default: op
  serversentials.stonecutter:
    default: op
  serversentials.smithingtable:
    default: op
  serversentials.invsee:
    default: op
  serversentials.invsee.edit:
    default: op
  serversentials.vanish:
    default: op
  serversentials.vanish.see:
    default: op
  serversentials.vanish.others:
    default: op
  #serversentials.hide:
    #default: op
  #serversentials.hide.others:
    #default: op
  serversentials.monitor:
    default: op
  serversentials.heal:
    default: op
  serversentials.heal.others:
    default: op
  serversentials.feed:
    default: op
  serversentials.feed.others:
    default: op
  serversentials.god:
    default: op
  serversentials.god.others:
    default: op
  serversentials.warp:
    default: op
  serversentials.warp.<name>:
    default: op
  serversentials.warps:
    default: op
  serversentials.warp.cooldown:
    default: op
  serversentials.warp.countdown:
    default: op
  serversentials.setwarp:
    default: op
  serversentials.item:
    default: op
  serversentials.item.others:
    default: op
  serversentials.enchant:
    default: op
  serversentials.enchant.others:
    default: op
  serversentials.enchant.<enchantname>:
    default: op
  serversentials.balance:
    description: Allows a player to check their own balance
    default: op
  serversentials.balance.others:
    description: Allows a player to check another player's balance
    default: op
  serversentials.pay:
    description: Allows a player to pay other players
    default: op
  serversentials.economy:
    description: Allows use of /economy
    default: op
  serversentials.economy.give:
    description: Allows giving money to a player
    default: op
  serversentials.economy.set:
    description: Allows setting a player's balance
    default: op
  serversentials.economy.deduct:
    description: Allows deducting money from a player
    default: op
  serversentials.baltop:
    description: Allows viewing the top balances on the server
    default: op
  serversentials.worldcommands:
    description: Allows usage of /day, /noon, /night, /clear, /rain, /storm
    default: op
  serversentials.teleport.top:
    description: Allows /top
    default: op
  serversentials.teleport.rtp:
    description: Allows /rtp
    default: op
  serversentials.back:
    description: Allows use of /back
    default: op
  serversentials.chat:
    description: Allows a player's chat to be custom formatted by Serversentials
    default: true
  serversentials.chat.color.all:
    description: Allows a player to use all MiniMessage colors in chat
    default: false
  serversentials.chat.style.all:
    description: Allows a player to use all MiniMessage styles/decorations in chat
    default: false
  serversentials.chat.format.admin:
    description: Allows a player to use the Admin chat format
    default: op
  serversentials.chat.format.vip:
    description: Allows a player to use the VIP chat format
    default: false
  serversentials.persistentgamemode:
    description: Allows a player's gamemode to persist across server changes
    default: false
  serversentials.itemrename:
    description: Allows a player to rename their held item
    default: op
  serversentials.lore:
    description: Allows a player to edit their held item's lore
    default: op
  serversentials.msg:
    description: Allows a player to send private messages
    default: op
  serversentials.socialspy:
    description: Allows viewing private messages between other players
    default: op
  serversentials.staffchat:
    description: Allows using staff chat
    default: op